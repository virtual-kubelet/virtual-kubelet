name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=15m --config=.golangci.yml
          skip-cache: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run Tests
        run: make test

  env-tests:
    name: Envtest Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run Tests
        run: make envtest

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KIND_CLUSTER_NAME: virtual-kubelet
      KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      KIND_VERSION: v0.33.0
      KUBERNETES_VERSION: v1.37.0
      SKAFFOLD_SHA256: 702344081860a587c57937cd55dfa2e70f124c05d6fb845319832ee23fd144a8
      SKAFFOLD_VERSION: v2.24.0
      GO111MODULE: "on"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Skaffold
        run: |
          curl -fsSLo skaffold https://storage.googleapis.com/skaffold/releases/${SKAFFOLD_VERSION}/skaffold-linux-amd64
          echo "${SKAFFOLD_SHA256}  skaffold" | sha256sum --check
          sudo install -m 0755 skaffold /usr/local/bin/skaffold
          echo /usr/local/bin >> $GITHUB_PATH
      - name: Install kubectl
        run: |
          curl -fsSLo kubectl https://dl.k8s.io/release/${KUBERNETES_VERSION}/bin/linux/amd64/kubectl
          curl -fsSLo kubectl.sha256 https://dl.k8s.io/release/${KUBERNETES_VERSION}/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
      - name: Install kind
        run: |
          curl -fsSLo kind-linux-amd64 https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64
          curl -fsSLo kind.sha256sum https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum
          sha256sum --check kind.sha256sum
          sudo install -m 0755 kind-linux-amd64 /usr/local/bin/kind
      - name: Start kind
        run: |
          kind create cluster \
            --name "${KIND_CLUSTER_NAME}" \
            --image "${KIND_NODE_IMAGE}" \
            --wait 120s
      - name: Run Tests
        run: make e2e
      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name "${KIND_CLUSTER_NAME}"
